name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage existing static files
        run: |
          mkdir -p _site
          cp index.html 404.html lofi-live.json _site/
          cp -a assets _site/
          if [ -d __grok ]; then cp -a __grok _site/; fi
          if [ -f favicon.svg ]; then cp favicon.svg _site/;
          elif [ -f public/favicon.svg ]; then cp public/favicon.svg _site/; fi
          touch _site/.nojekyll
          python3 -c "from pathlib import Path; d=Path('_site/index.html').read_bytes(); assert b'\\x00' not in d, 'NUL in index.html'; print('index.html', len(d), 'bytes')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
